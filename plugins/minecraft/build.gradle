plugins {
    id "base"
}

allprojects {
    group = "com.nortix"
    version = "0.5.0"

    repositories {
        mavenCentral()
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
    }
}

subprojects {
    apply plugin: "java"

    dependencies {
        testImplementation platform("org.junit:junit-bom:5.13.4")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    tasks.withType(Jar).configureEach {
        archiveBaseName = "nortix-${project.name}"
    }
}

tasks.register("copyPluginJars", Copy) {
    dependsOn(":paper:jar", ":velocity:jar", ":identity-verifier:jar")
    from(project(":paper").tasks.named("jar"))
    from(project(":velocity").tasks.named("jar"))
    from(project(":identity-verifier").tasks.named("jar"))
    into(layout.projectDirectory.dir("dist"))
}

tasks.register("copyWebPluginJars", Copy) {
    dependsOn(":paper:jar", ":velocity:jar", ":identity-verifier:jar")
    from(project(":paper").tasks.named("jar"))
    from(project(":velocity").tasks.named("jar"))
    from(project(":identity-verifier").tasks.named("jar"))
    into(layout.projectDirectory.dir("../../apps/web/public/downloads"))
}

tasks.named("build") {
    dependsOn("copyPluginJars", "copyWebPluginJars")
}
